services:
  db:
    image: mysql:8.0
    container_name: powerrev_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: powerrev_torneios
      MYSQL_USER: powerrev_user
      MYSQL_PASSWORD: powerrev_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d # Executa automaticamente scripts .sql na primeira inicialização!

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tournament-backend
    environment:
      DATABASE_URL: mysql+pymysql://powerrev_user:powerrev_password@db:3306/powerrev_torneios
    ports:
      - "8000:8000"
    volumes:
      - ./database:/database:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    container_name: tournament-frontend
    ports:
      - "3000:80"
    restart: always

volumes:
  mysql_data:
