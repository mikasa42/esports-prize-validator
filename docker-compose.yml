services:
  backend-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${BACKEND_MYSQL_ROOT_PASSWORD:-backend_rootpassword}
      MYSQL_DATABASE: ${BACKEND_MYSQL_DATABASE:-esports_backend}
      MYSQL_USER: ${BACKEND_MYSQL_USER:-backend_user}
      MYSQL_PASSWORD: ${BACKEND_MYSQL_PASSWORD:-backend_password}
    ports:
      - "3306:3306"
    volumes:
      - backend_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  official-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: official
    container_name: fortnite-official-api
    command: ["uvicorn", "src.simulator.official_api_server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      OFFICIAL_DATA_PATH: /app/src/simulator/Partidas_oficiais.json
    ports:
      - "8001:8001"
    volumes:
      - ./backend/src/simulator/Partidas_oficiais.json:/app/src/simulator/Partidas_oficiais.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tournament-backend
    environment:
      OFFICIAL_API_URL: http://official-api:8001
      MYSQL_HOST: backend-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${BACKEND_MYSQL_DATABASE:-esports_backend}
      MYSQL_USER: ${BACKEND_MYSQL_USER:-backend_user}
      MYSQL_PASSWORD: ${BACKEND_MYSQL_PASSWORD:-backend_password}
    ports:
      - "8000:8000"
    depends_on:
      backend-db:
        condition: service_healthy
      official-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    container_name: tournament-frontend
    ports:
      - "3000:80"
    restart: always

volumes:
  backend_mysql_data:
