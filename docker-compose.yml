version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: powerrev_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: powerrev_torneios
      MYSQL_USER: powerrev_user
      MYSQL_PASSWORD: powerrev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d # Executa automaticamente scripts .sql na primeira inicialização!

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tournament-frontend
    ports:
      - "3000:80"
    restart: always

volumes:
  mysql_data: