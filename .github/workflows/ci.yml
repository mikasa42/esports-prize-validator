name: CI - Testes do backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir e iniciar os serviços
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Executar testes do backend
        run: docker compose exec -T backend python -m unittest discover -s tests -v

      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Encerrar os serviços
        if: always()
        run: docker compose down -v
